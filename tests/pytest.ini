[pytest]
norecursedirs =
    temp
markers =
    timeout: mark a test with a timeout to skip or abort if exceeded
    qt: mark a test that requires a Qt event loop / qt_app fixture
    rss: mark a test that requires RSS/network access (skipped by default)
    hybrid: mark a test that requires hybrid source setup (skipped by default)
    slow: mark a test as slow running
    frame_timing_isolated: mark frame timing workloads that must run outside the default suite for clean GL/animation state
addopts = -m "not rss and not hybrid"
# pytest keeps its default tmp_path retention (the last 3 runs): `failed` removed a passing test's folder at its
# teardown, which broke later tests that still read it (test_settings_dialog, test_3d_curated_preset_ownership,
# 7 Nov; Current_Plan.md §3). Never set --basetemp in addopts: pytest wipes the basetemp at session start, so
# concurrent runs would delete each other's.
